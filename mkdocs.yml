site_name: SABnzbd for Mere Mortals
site_description: A Usenet downloader with a web interface, explained in plain language. How an NZB map becomes finished files through fetching, decoding, PAR2 repair and unpacking, how the queue, categories, RSS feeds and the API work, and where its limits sit, verified against the real program on a local test server.
site_url: https://paulsullivan33-dev.github.io/sabnzbd-for-mere-mortals/
